server {
    listen 80;
    server_name butitsbutter.dev tpedaytrip.butitsbutter.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name butitsbutter.dev tpedaytrip.butitsbutter.dev;

    ssl_certificate /etc/letsencrypt/live/tpedaytrip.butitsbutter.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tpedaytrip.butitsbutter.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
